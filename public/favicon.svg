<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appleCatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#0f0f14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="catAura" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>

    <!-- Ear Inner Gradient -->
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
  </defs>

  <!-- Apple Rounded Squircle Container -->
  <rect width="128" height="128" rx="30" fill="url(#appleCatBg)" />
  <rect width="128" height="128" rx="30" fill="url(#catAura)" />
  <rect width="126" height="126" x="1" y="1" rx="29" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- CAT SILHOUETTE & EARS -->
  <!-- Left Outer Ear -->
  <path d="M28 62 L22 22 L60 40 Z" fill="#ffffff" />
  <!-- Left Inner Ear -->
  <path d="M32 54 L27 28 L54 41 Z" fill="url(#earPink)" />

  <!-- Right Outer Ear -->
  <path d="M100 62 L106 22 L68 40 Z" fill="#ffffff" />
  <!-- Right Inner Ear -->
  <path d="M96 54 L101 28 L74 41 Z" fill="url(#earPink)" />

  <!-- Cat Head -->
  <ellipse cx="64" cy="74" rx="44" ry="38" fill="#ffffff" />

  <!-- Cute Cat Eyes (Big Kawaii Style with Double Twinkle) -->
  <!-- Left Eye -->
  <ellipse cx="46" cy="70" rx="7.5" ry="9" fill="#18181b" />
  <circle cx="43.5" cy="67" r="3.2" fill="#ffffff" />
  <circle cx="48.5" cy="73.5" r="1.5" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="82" cy="70" rx="7.5" ry="9" fill="#18181b" />
  <circle cx="79.5" cy="67" r="3.2" fill="#ffffff" />
  <circle cx="84.5" cy="73.5" r="1.5" fill="#ffffff" />

  <!-- Soft Pink Cheeks -->
  <ellipse cx="34" cy="79" rx="6.5" ry="4" fill="#fda4af" opacity="0.65" />
  <ellipse cx="94" cy="79" rx="6.5" ry="4" fill="#fda4af" opacity="0.65" />

  <!-- Cute Nose (Tiny Soft Pink Triangle) -->
  <path d="M60.5 78.5 C62 77, 66 77, 67.5 78.5 C65.5 82, 62.5 82, 60.5 78.5 Z" fill="#f43f5e" />

  <!-- Cat Mouth (:3 curve) -->
  <path d="M57 82 Q64 86 64 82 Q64 86 71 82" fill="none" stroke="#52525b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Whiskers -->
  <path d="M14 74 L32 76 M16 82 L33 80" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M114 74 L96 76 M112 82 L95 80" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Cute Tiny Paws peeking at bottom -->
  <ellipse cx="44" cy="110" rx="13" ry="9" fill="#ffffff" />
  <ellipse cx="84" cy="110" rx="13" ry="9" fill="#ffffff" />
  <circle cx="39" cy="108" r="2" fill="#e2e8f0" />
  <circle cx="44" cy="106" r="2" fill="#e2e8f0" />
  <circle cx="49" cy="108" r="2" fill="#e2e8f0" />
  <circle cx="79" cy="108" r="2" fill="#e2e8f0" />
  <circle cx="84" cy="106" r="2" fill="#e2e8f0" />
  <circle cx="89" cy="108" r="2" fill="#e2e8f0" />
</svg>
